# All tunable numbers. Edit freely; no recompiling needed. '#' starts a comment.

# --- Impact score: weights should add up to 1.0; norm.* is the value counted as "maximum" ---
weight.population = 0.40
weight.depth      = 0.35
weight.rain       = 0.25
norm.population   = 10000     # people
norm.depth        = 3         # metres of flood water
norm.rain         = 100       # mm of rain (24 h + nowFactor * current mm/h)
rain.nowFactor    = 3

# --- Classification thresholds on the 0-100 score ---
level.moderate = 20
level.high     = 40
level.critical = 60

# --- How much each report source is trusted (0-1) ---
trust.sensor              = 0.90
trust.citizenBase         = 0.35
trust.citizenPerSupporter = 0.15
trust.citizenMax          = 0.90
trust.weatherStrong       = 0.80   # used when 24 h rain >= weather.strongRain24h
trust.weatherWeak         = 0.30
weather.strongRain24h     = 20

# --- Roads: slow-down per mm/h of rain and per metre of flood; closure by extreme rain ---
road.rainSlow      = 0.20
road.floodSlow     = 0.25
road.maxFactor     = 4
road.closeRainMmH  = 30

# --- Vehicle limits (metres of flood depth) ---
vehicle.truckMaxDepth = 0.5
vehicle.boatMinDepth  = 0.5

# --- Supplies and evacuation ---
supply.perPersonPerDay = 3      # relief units per affected person per day
supply.days            = 1
affect.fullDepth       = 2.0    # depth (m) at which the whole population counts as affected
evac.minScore          = 40     # zones at or above this score are evacuated

# --- Live weather: command that writes <data>/weather.csv (the data folder is appended) ---
weather.command = py tools/fetch_weather.py
